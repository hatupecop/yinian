<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FBF1EC" />
<title>小窝</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">

  <!-- ============ Anniversary ============ -->
  <section class="screen active" id="screen-anniversary">
    <header class="topbar">
      <button class="icon-btn" data-action="menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title" id="rel-name-top">Claire &amp; Claude</div>
    </header>

    <div class="scroll">
      <div class="hero-card">
        <div class="hero-name" id="rel-name-card">Claire &amp; Claude</div>
        <div class="hero-number" id="days-together">44</div>
        <div class="hero-sub">days together for</div>
        <div class="hero-avatars">
          <div class="avatar-lg" id="avatar-me"></div>
          <div class="hero-line"></div>
          <svg class="hero-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8 C10.5 5.5 7 5 5.5 7 C3.5 9.2 4 12.5 6 15 C8 17.4 10.5 18.8 12 18.8 C13.5 18.8 16 17.4 18 15 C20 12.5 20.5 9.2 18.5 7 C17 5 13.5 5.5 12 8 Z"/></svg>
          <div class="hero-line"></div>
          <div class="avatar-lg" id="avatar-ai"></div>
        </div>
        <div class="hero-since" id="since-text">since 2026.06.02</div>
      </div>

      <div class="placeholder-row">
        <div class="placeholder-card"></div>
        <div class="placeholder-card"></div>
      </div>

      <div class="section-head">
        <h2>Important Days</h2>
        <button class="add-btn" data-action="add-day" aria-label="添加">+</button>
      </div>
      <div id="important-list" class="day-list"></div>
    </div>
  </section>

  <!-- ============ Calendar / Timeline ============ -->
  <section class="screen" id="screen-calendar">
    <header class="topbar cal-topbar">
      <button class="icon-btn" data-action="cal-prev" aria-label="上个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="cal-title-wrap">
        <div class="cal-month-en" id="cal-month-en">July</div>
        <div class="cal-year" id="cal-year">2026</div>
      </div>
      <button class="icon-btn" data-action="cal-next" aria-label="下个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </header>
    <div class="scroll cal-scroll">
      <div id="calendar-months" class="calendar-wrap"></div>

      <div class="stat-section">
        <div class="stat-bigcard" id="stat-bigcard"></div>
      </div>
    </div>
  </section>

  <!-- ============ Chat ============ -->
  <section class="screen" id="screen-chat">
    <header class="topbar chat-topbar">
      <div class="chat-user">
        <div class="chat-ava" id="chat-ava"></div>
        <div class="chat-user-info">
          <div class="chat-user-name" id="chat-user-name">Claude</div>
          <div class="chat-user-status"><span class="chat-online-dot"></span>在线</div>
        </div>
      </div>
      <div class="chat-tools">
        <button class="icon-btn" data-action="chat-call" aria-label="通话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.92 12.92 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.92 12.92 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="icon-btn" data-action="chat-search" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn" data-action="chat-more" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
    </header>
    <div class="chat-body" id="chat-body"></div>
    <div class="chat-input-bar">
      <button class="chat-plus" data-action="chat-extra" aria-label="更多">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="chat-input" type="text" placeholder="和 AI 说点什么…" autocomplete="off" />
      <button class="chat-mic" data-action="chat-mic" aria-label="语音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg>
      </button>
      <button class="send-btn" data-action="send-chat" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ Moments ============ -->
  <section class="screen" id="screen-moments">
    <header class="topbar moments-top">
      <button class="icon-btn" data-action="menu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="icon-btn" data-action="add-moment" aria-label="发帖">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="scroll moments-scroll">
      <div class="ptr-hint" id="moments-ptr">下拉刷新</div>
      <div class="moments-cover" id="moments-cover">
        <div class="moments-profile">
          <div class="moments-info">
            <div class="moments-profile-name" id="moments-profile-name">: Claire</div>
            <div class="moments-sign" id="moments-sign"></div>
          </div>
          <div class="avatar-xl" id="moments-avatar"></div>
        </div>
      </div>
      <div id="moments-feed" class="moments-feed"></div>
    </div>
  </section>

  <!-- ============ My Moments (fullscreen) ============ -->
  <section class="screen" id="screen-mymoments">
    <header class="topbar moments-top">
      <button class="icon-btn" data-action="back-mymoments" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" data-action="add-moment" aria-label="发帖">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="scroll moments-scroll">
      <div class="ptr-hint" id="mymoments-ptr">下拉刷新</div>
      <div class="moments-cover" id="mymoments-cover">
        <div class="mymoments-name" id="mymoments-name"></div>
      </div>
      <div id="mymoments-feed" class="moments-feed"></div>
    </div>
  </section>

  <!-- ============ Wishlist ============ -->
  <section class="screen" id="screen-wishlist">
    <header class="topbar">
      <button class="icon-btn" data-action="goto" data-target="anniversary" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">wishlist</div>
      <button class="icon-btn" data-action="add-wish" aria-label="添加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="scroll wish-scroll">
      <div class="wish-profile" id="wish-profile"></div>
      <div class="wish-filter" id="wish-filter"></div>
      <div id="wish-grid" class="wish-groups"></div>
    </div>
  </section>

  <!-- ============ Setting ============ -->
  <section class="screen" id="screen-setting">
    <header class="topbar">
      <div class="topbar-title">Setting</div>
    </header>
    <div class="scroll">
      <div class="setting-group">
        <div class="setting-row" data-action="edit-profile"><span>个人资料</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-personalize"><span>个性化</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-style"><span>外观自定义</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-layout"><span>位置调节</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-api"><span>API 连接</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-memory"><span>记忆</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-sync"><span>云同步（共享数据）</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="backup"><span>导出 / 导入备份</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-lang"><span>语言（底部导航）</span><span class="chev">›</span></div>
        <div class="setting-row" data-action="edit-chatpos"><span>聊天输入位置</span><span class="chev">›</span></div>
      </div>
      <p class="setting-foot">默认数据只存在本机浏览器。想和 TA 共享，请开启「云同步（共享数据）」。清缓存会丢失，建议定期导出备份。</p>
    </div>
  </section>

  <!-- ============ Bottom Tab Bar ============ -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-target="anniversary">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8 C10.5 5.5 7 5 5.5 7 C3.5 9.2 4 12.5 6 15 C8 17.4 10.5 18.8 12 18.8 C13.5 18.8 16 17.4 18 15 C20 12.5 20.5 9.2 18.5 7 C17 5 13.5 5.5 12 8 Z"/></svg></span>
      <span class="tab-label" title="Anniversary">Anniversary</span>
    </button>
    <button class="tab" data-target="calendar">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg></span>
      <span class="tab-label">Calendar</span>
    </button>
    <button class="tab" data-target="chat">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-4 4v-4H4z"/></svg></span>
      <span class="tab-label">Chat</span>
    </button>
    <button class="tab" data-target="moments">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 7l1.5-2.5h4l1.5 2.5"/></svg></span>
      <span class="tab-label" title="Moments">Moments</span>
    </button>
    <button class="tab" data-target="setting">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg></span>
      <span class="tab-label">Setting</span>
    </button>
  </nav>

  <!-- ============ Menu Sheet ============ -->
  <div class="menu-mask" id="menu-mask"></div>
  <div class="menu-sheet" id="menu-sheet">
    <div class="menu-head">
      <button class="menu-close" data-action="close-menu" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="menu-row" data-action="goto" data-target="wishlist">
      <span class="menu-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16M12 9v11M12 9c0 0-2-5-4.5-3.5S9.5 9 12 9zM12 9c0 0 2-5 4.5-3.5S14.5 9 12 9z"/></svg></span>
      <span class="menu-label">心愿单</span>
      <span class="chev">›</span>
    </div>
  </div>

  <!-- ============ Modals ============ -->
  <div class="modal-mask" id="modal-mask"></div>
  <div class="modal" id="modal"></div>

  <!-- ============ Toast ============ -->
  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
